        return json(404, null);
      };

              check('the summary counts hard / soft / info', qa('.dapp-summary-cell').length === 3, `${qa('.dapp-summary-cell').length} cells`);
              check('the verdict reports the violations', text().includes('发现 2 条违规'), text().slice(0, 0));
              check('the violations render as cards', text().includes('W-ABS-01') && text().includes('期望：1-4 次'));
              check('the violation carries its source', /references\/checklist\.md:30/.test(text()));
            }
          }

          // ── 7. 去AI: de-AI scan ───────────────────────────────────────
          click(tabByLabel('去AI'));
          await sleep(400);
          const deaiArea = q('.dapp-textarea');
          check('the de-AI view has a textarea', !!deaiArea);
          if (deaiArea) {
            setArea(deaiArea, 'We delve into the method, which is noteworthy.');
            await sleep(200);
            const scanButton = qa('.dapp-btn').find((btn) => btn.textContent.includes('开始扫描'));
            check('the scan button renders', !!scanButton);
            if (scanButton) {
              click(scanButton);
              await sleep(700);
              check('the scan posts to the host API', callsTo('/api/deai').some((call) => call.method === 'POST'));
              check('the de-AI score renders', q('.dapp-score-big')?.textContent === '72', q('.dapp-score-big')?.textContent);
              check('the hits render with their category', text().includes('空动词套话'));
              check('the hits render with a suggestion', text().includes('换成具体动作'));
              check('the copy-all button renders', qa('.dapp-btn').some((btn) => btn.textContent.includes('复制全部建议')));
            }
          }

          // ── 8. 清单: stage tabs + persisted ticks ──────────────────────
          click(tabByLabel('清单'));
          await sleep(600);
          check('the checklist renders stage groups', qa('.dapp-group').length === 2, `${qa('.dapp-group').length} groups`);
          const stageChip = qa('.dapp-chipbtn').find((chip) => chip.textContent.includes('投稿前自查'));
          check('the checklist renders stage tabs', !!stageChip, qa('.dapp-chipbtn').map((c) => c.textContent).join('/'));
          check('checkboxes are visible', qa('.dapp-box').length === 3, `${qa('.dapp-box').length} boxes`);
          const before = text().match(/进度 (\d+)\/(\d+)/);
          const item = q('.dapp-item');
          check('checklist items render', !!item);
          if (item) {
            click(q('.dapp-box'));
            await sleep(350);
            const after = text().match(/进度 (\d+)\/(\d+)/);
            check('ticking an item advances the progress', !!(before && after && Number(after[1]) === Number(before[1]) + 1), `${before && before[1]} -> ${after && after[1]}`);
            check('ticked item is marked', !!q('.dapp-item[data-checked=true]'));
            const saved = JSON.parse(localStorage.getItem('dsh-academic-paper-polish.checklist') || '{}');
            check('tick persists to localStorage', Object.keys(saved).length === 1, JSON.stringify(saved));
          }
          if (stageChip) {
            click(stageChip);
            await sleep(300);
            check('a stage tab narrows the list', qa('.dapp-group').length === 1, `${qa('.dapp-group').length} groups`);
            click(stageChip);
            await sleep(300);
          }

          // ── 9. 手册: the manual browser still works ───────────────────
          click(tabByLabel('手册'));
          await sleep(500);
          const search = q('.dapp-search input');
          check('search box present', !!search);
          check('the live index was fetched from the host route', window.__indexFetched === true);
          if (search) {
            setInput(search, 'ZooBank');
            await sleep(600);
            const hits = qa('.dapp-file').length;
            check('a body-only term still finds its file', hits === 1, `${hits} hits for ZooBank`);
            check('the query was sent to the host route', window.__searchQueries.includes('ZooBank'), JSON.stringify(window.__searchQueries));
            const snippet = q('.dapp-file-snip');
            check('the hit shows the matched snippet', !!snippet && snippet.textContent.includes('ZooBank'), snippet ? snippet.textContent.slice(0, 60) : '(none)');
            check('the hit shows the file path', /references\//.test(text()));
            setInput(search, 'zzzznotfound');
            await sleep(600);
            check('search shows an empty state', text().includes('没有命中'));
            setInput(search, '');
            await sleep(300);
          }

          // ── 10. 「发送到会话」 ─────────────────────────────────────────
          click(tabByLabel('速查'));
          await sleep(500);
          const sendButton = qa('.dapp-btn').find((btn) => btn.textContent.includes('发给会话'));
          check('the rule card offers 「发给会话」', !!sendButton);
          if (sendButton) {
            click(sendButton);
            await sleep(600);
            check('「发给会话」 posts to the host API', callsTo('/api/send').some((call) => call.method === 'POST'));
            check('「发给会话」 confirms with a toast', text().includes('已发送到当前会话'), text().slice(-60));
          }

          // ── 11. error states: unauthorized / unreachable / missing ─────
          let probeTurn = 0;
          const errorProbe = async (mode, expected) => {
            window.__apiMode = mode;
            click(tabByLabel('速查'));
            await sleep(200);
            const box = q('.dapp-search input');
            // The probe text has to CHANGE, otherwise the debounced query
            // never changes and no request goes out.
            probeTurn += 1;
            if (box) setInput(box, `probe${probeTurn}`);
            await sleep(800);
            const shown = text().includes(expected);
            const chrome = qa('.dapp-tab').length === 6 && text().includes('论文助手');
            return { shown, chrome };
          };
          const unauthorized = await errorProbe('401', '未授权：宿主拒绝了请求');
          check('a 401 shows the unauthorized state', unauthorized.shown);
          check('the panel chrome survives an unauthorized API', unauthorized.chrome);
          const missing = await errorProbe('404', '宿主尚未提供该接口');
          check('a 404 shows the not-implemented state', missing.shown);
          check('the panel chrome survives a missing API', missing.chrome);
          const offline = await errorProbe('offline', '宿主路由不可达');
          check('an unreachable host shows its own state', offline.shown);
          check('the panel chrome survives an unreachable API', offline.chrome);
          check(
            'the three failure states are distinguishable',
            text().includes('宿主路由不可达') && !text().includes('未授权：宿主拒绝了请求'),
          );
          window.__apiMode = 'ok';
          const box = q('.dapp-search input');
          if (box) {
            setInput(box, '');
            await sleep(600);
          }

          // ── 12. keyboard shortcut ──────────────────────────────────────
          window.dispatchEvent(new KeyboardEvent('keydown', { key: '5', bubbles: true }));
          await sleep(350);
          const activeTab = q('.dapp-tab[data-active=true]')?.textContent || '';
          check('number key switches views', activeTab.includes('清单'), `active tab: ${activeTab}`);

          // ── 13. persistence of the view state ──────────────────────────
          const storedView = JSON.parse(localStorage.getItem('dsh-academic-paper-polish.view') || 'null');
          check('the active view is persisted', storedView === 'checklist', `stored view: ${storedView}`);

          // ── 14. no console errors ───────────────────────────────────────
          check('no uncaught errors during the run', window.__errors.length === 0, window.__errors.join(' | '));
        } catch (error) {
          results.push(`✗ harness crashed: ${error && error.message}`);
          results.push(`stack: ${String((error && error.stack) || '').split('\n').slice(0, 4).join(' | ')}`);
        } finally {
          const failed = results.filter((r) => r.startsWith('✗')).length;
          report(`${results.length - failed}/${results.length} passed\n\n${results.join('\n')}`);
          document.title = `DONE:${failed}`;
        }
      })();
    </script>
  </body>
</html>
