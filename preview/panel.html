<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DSH 论文助手面板预览</title>
    <link rel="stylesheet" href="./tokens.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--dsw-alias-bg-base);
        font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        color: var(--dsw-alias-label-primary);
      }
      #frame {
        width: var(--frame-width, 380px);
        height: 100vh;
        border-right: 1px solid var(--dsw-alias-border-l1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #root {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="frame"><div id="root"></div></div>
    <script src="file:///C:/Users/Administrator/.dsh/profiles/web/node_modules/react/umd/react.production.min.js"></script>
    <script src="file:///C:/Users/Administrator/.dsh/profiles/web/node_modules/react-dom/umd/react-dom.production.min.js"></script>
    <script>
      // pick the view from ?view=matrix (before the panel reads localStorage)
      const view = new URLSearchParams(location.search).get('view') || 'journal';
      const dark = new URLSearchParams(location.search).get('dark') === '1';
      // ?w= reproduces a different right-sidebar width; the real track is
      // resizable, so the panel has to hold at 320px and at 560px alike.
      const frameWidth = new URLSearchParams(location.search).get('w');
      if (frameWidth) {
        document.documentElement.style.setProperty('--frame-width', `${frameWidth}px`);
      }
      try {
        localStorage.setItem('dsh-academic-paper-polish.view', JSON.stringify(view));
        localStorage.removeItem('dsh-academic-paper-polish.checklist.v1');
      } catch (error) {
        /* file:// may block storage */
      }
      if (dark) document.body.setAttribute('data-ds-dark-theme', '');
      window.__probe = {
        dark,
        search: location.search,
        bodyExists: Boolean(document.body),
        attr: document.body ? document.body.getAttribute('data-ds-dark-theme') : '(no body)',
        attrs: document.body ? [...document.body.attributes].map((a) => a.name) : [],
      };
      // the DSH client module loader shim
      window.__ModuleLoader__ = {
        load(definition) { window.__definition = definition; },
      };
    </script>
    <script src="./preview-data.js"></script>
    <script src="./fixtures/responses.js"></script>
    <script>
      // ── stub of the host route ─────────────────────────────────────────────
      // The preview has no host process, so the host API is answered here from
      // the REAL data and the REAL engine output (scripts/build-preview-data.mjs
      // produces this file). A screenshot of the preview is therefore a
      // screenshot of the production data.
      //
      // The 稿件 view is answered from preview/fixtures/responses.js: the REAL
      // output of lib/session.mjs (the discovery) and lib/analyze.mjs (the
      // analysis) over the fixture manuscripts under preview/fixtures/.
      (() => {
        const DATA = window.__PREVIEW_DATA__;
        const MANUSCRIPT = window.__PREVIEW_MANUSCRIPT__;
        if (!DATA) return;
        const json = (body) =>
          new Response(JSON.stringify(body), {
            status: 200,
            headers: { 'content-type': 'application/json; charset=utf-8' },
          });
        const text = (value) => String(value ?? '').trim().toLowerCase();
        const match = (rule, query) => {
          if (!query) return true;
          const needle = text(query);
          return [rule.id, rule.title, rule.statement, rule.fix, ...(rule.tags || []), ...(rule.sections || [])]
            .join(' ')
            .toLowerCase()
            .includes(needle);
        };
        const realFetch = window.fetch?.bind(window);
        const apiMode = new URLSearchParams(location.search).get('api') || '';
        window.fetch = async (input, init = {}) => {
          const url = new URL(String(input), location.href);
          const path = url.pathname;
          const query = url.searchParams;
          const method = (init.method || 'GET').toUpperCase();

          // ?api=401 | 404 | down reproduces the three host failure modes.
          if (apiMode && path.includes('/dsh-academic-paper-polish/')) {
            if (apiMode === 'down') throw new TypeError('Failed to fetch');
            return new Response(apiMode === '404' ? 'not found' : 'unauthorized', {
              status: apiMode === '404' ? 404 : 401,
            });
          }

          if (path.endsWith('/api/meta')) return json(DATA.meta);
          if (path.endsWith('/api/rules')) {
            const section = query.get('section');
            const severity = query.get('severity');
            const q = query.get('query');
            const rules = DATA.rules.filter(
              (rule) =>
                (!section || rule.sections.includes(section)) &&
                (!severity || rule.severity === severity) &&
                match(rule, q),
            );
            return json({ rules, total: rules.length });
          }
          if (path.endsWith('/api/journals')) {
            const q = text(query.get('query'));
            const field = text(query.get('field'));
            const openAccess = query.get('openAccess');
            const maxApc = Number(query.get('maxApc') || 0);
            const journals = DATA.journals.filter((journal) => {
              if (field && !(journal.field || []).some((f) => text(f).includes(field))) return false;
              if (openAccess === 'true' && !journal.openAccess) return false;
              if (maxApc > 0 && Number(journal.apc || 0) > maxApc) return false;
              if (!q) return true;
              return [journal.name, journal.publisher, journal.scope, ...(journal.field || [])]
                .join(' ')
                .toLowerCase()
                .includes(q);
            });
            return json({ journals, total: journals.length });
          }
          if (path.endsWith('/api/sentences')) {
            const q = text(query.get('query'));
            const patterns = DATA.sentences.filter((pattern) =>
              !q ? true : `${pattern.zh} ${pattern.en} ${pattern.category}`.toLowerCase().includes(q),
            );
            return json({ patterns, total: patterns.length });
          }
          if (path.endsWith('/api/checklists')) {
            const stage = query.get('stage');
            const stages = stage ? DATA.checklists.filter((s) => s.id === stage) : DATA.checklists;
            return json({ stages, total: stages.length });
          }
          if (path.endsWith('/api/check')) {
            let body = {};
            try {
              body = JSON.parse(init.body || '{}');
            } catch (error) {
              body = {};
            }
            return json(body.journal ? DATA.demo.check : DATA.demo.checkNoJournal);
          }
          if (path.endsWith('/api/deai')) return json(DATA.demo.deai);
          if (path.endsWith('/api/outline')) return json(DATA.demo.outline);
          if (path.endsWith('/api/send')) return json({ ok: true, sessionId: 'preview-session', mode: 'followup' });
          // ── the manuscript of the session ────────────────────────────────
          if (path.endsWith('/api/session/files')) {
            if (!MANUSCRIPT) return new Response('not found', { status: 404 });
            const name = new URLSearchParams(location.search).get('fixture') || 'single';
            const fixture = MANUSCRIPT.fixtures[name] || MANUSCRIPT.fixtures.single;
            return json(fixture.files);
          }
          if (path.endsWith('/api/analyze')) {
            if (!MANUSCRIPT) return new Response('not found', { status: 404 });
            let body = {};
            try {
              body = JSON.parse(init.body || '{}');
            } catch (error) {
              body = {};
            }
            const name = new URLSearchParams(location.search).get('fixture') || 'single';
            const fixture = MANUSCRIPT.fixtures[name] || MANUSCRIPT.fixtures.single;
            const id = fixture.map[String(body.path || '').replace(/\\/g, '/')];
            const analysis = id ? MANUSCRIPT.analyses[id] : null;
            if (!analysis) {
              return new Response(
                JSON.stringify({ error: 'file-not-found', message: `预览没有这个稿件的答案：${body.path}` }),
                { status: 404, headers: { 'content-type': 'application/json' } },
              );
            }
            return json(analysis);
          }
          if (path.endsWith('/skill-index')) {
            // The real route answers with a BARE ARRAY of index entries.
            const needle = text(query.get('q'));
            const files = DATA.index || [];
            const hits = needle
              ? files.filter((file) => `${file.title} ${file.path}`.toLowerCase().includes(needle))
              : files;
            return json(hits);
          }
          if (realFetch) return realFetch(input, init);
          return new Response('not found', { status: 404 });
        };
      })();
    </script>
    <script src="../client.js?v=20261106"></script>
    <script>
      const plugin = window.__definition.factory((name) => {
        if (name === 'react') return React;
        // `react-dom` is a platform seed word: the 稿件 view portals its file
        // picker to the document body, exactly like the host's own Modal.
        if (name === 'react-dom') return ReactDOM;
        throw new Error('unknown module ' + name);
      });
      let registered = null;
      const ctx = {
        locale: {
          register: () => () => {},
          bind: () => (key) => key,
          getLocale: () => ({ id: 'zh' }),
        },
        slots: {
          inject(_name, cb) { cb(); },
          register(_def, Comp) { registered = Comp; return () => {}; },
        },
        sidebarRightTabs: { register: () => () => {} },
        sidebarRight: { openTab: () => {} },
        effect(fn) { fn(); return () => {}; },
        inject(_deps, cb) { cb(ctx); },
      };
      plugin.apply(ctx);
      // The panel is mounted in a SESSION: the slot hands it the session id
      // and the host's own `useSessions` hook, and the panel reads the
      // session's working directory through that hook.
      // ?nosession=1 mounts it WITHOUT a session — the state the panel shows
      // when it may not guess one.
      const MANUSCRIPT = window.__PREVIEW_MANUSCRIPT__;
      const noSession = new URLSearchParams(location.search).get('nosession') === '1';
      const fixtureName = new URLSearchParams(location.search).get('fixture') || 'single';
      const fixture = MANUSCRIPT && MANUSCRIPT.fixtures[fixtureName];
      const sessionId = 'preview-session';
      const sessionCwd = fixture ? fixture.cwd : 'D:/preview';
      try {
        // The target journal of the preview: the analysis payload was produced
        // for this journal, so the panel and the payload agree.
        localStorage.setItem('dsh-academic-paper-polish.journal', JSON.stringify('palaeontology'));
      } catch (error) {
        /* file:// may block storage */
      }
      ReactDOM.createRoot(document.getElementById('root')).render(
        React.createElement(registered, {
          ctx,
          sessionId: noSession ? '' : sessionId,
          useSessions: noSession
            ? undefined
            : (selector) =>
                selector({ byId: { [sessionId]: { id: sessionId, cwd: sessionCwd } } }),
        }),
      );
      // ?demo=1 fills the textarea and presses the button, so a screenshot can
      // show the RESULT of a check instead of the empty input state.
      if (new URLSearchParams(location.search).get('demo') === '1' && window.__PREVIEW_DATA__) {
        const sample = window.__PREVIEW_DATA__.demo.sample;
        setTimeout(() => {
          const area = document.querySelector('textarea');
          if (area) {
            const setter = Object.getOwnPropertyDescriptor(
              window.HTMLTextAreaElement.prototype,
              'value',
            ).set;
            setter.call(area, sample);
            area.dispatchEvent(new Event('input', { bubbles: true }));
          }
          setTimeout(() => {
            const button = [...document.querySelectorAll('button')].find((node) =>
              /开始检查|开始扫描|分析会话论文/.test(node.textContent || ''),
            );
            if (button) button.click();
          }, 200);
        }, 200);
      }
      if (new URLSearchParams(location.search).get('diag') === '1') {
        setTimeout(() => {
          const el = document.querySelector('.dapp-dim');
          const sheets = [...document.styleSheets];
          const info = sheets.map((sheet, index) => {
            let rules = [];
            try {
              rules = [...sheet.cssRules];
            } catch (error) {
              rules = [];
            }
            return {
              index,
              href: sheet.href ? sheet.href.split('/').pop() : 'inline',
              owner: sheet.ownerNode ? sheet.ownerNode.tagName + ':' + (sheet.ownerNode.className || '-') : '-',
              count: rules.length,
              hasDim: rules.some((rule) => rule.selectorText === '.dapp-dim'),
              last: rules.slice(-2).map((rule) => rule.selectorText || rule.cssText.slice(0, 40)),
            };
          });
          document.title = JSON.stringify({
            dimFound: Boolean(el),
            fontSize: el ? getComputedStyle(el).fontSize : null,
            styleTags: [...document.querySelectorAll('style')].map((node) => node.textContent.length),
            darkAttr: document.body.getAttribute('data-ds-dark-theme'),
            probe: window.__probe,
            bodyBg: getComputedStyle(document.body).backgroundColor,
            rootToken: getComputedStyle(document.documentElement).getPropertyValue('--dsw-alias-bg-layer-1').trim(),
            bodyToken: getComputedStyle(document.body).getPropertyValue('--dsw-alias-bg-layer-1').trim(),
            panelBg: (() => {
              const panel = document.querySelector('.dapp');
              return panel ? getComputedStyle(panel).backgroundColor : null;
            })(),
            info,
          });
        }, 800);
      }
    </script>
  </body>
</html>
